version: '3.8'

services:
  rmsa-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmsa-academy-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Mount thư mục database SQLite và uploads ra ngoài host để dữ liệu tồn tại vĩnh viễn
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
