# Cấu hình Nginx Production cho RMSA Sales Academy
# Đường dẫn cài đặt đề xuất trên VPS Ubuntu: /etc/nginx/sites-available/rmsa.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/rmsa.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Thay thế bằng tên miền thật của bạn

    # Giới hạn kích thước tải lên video (1GB)
    client_max_body_size 1024M;

    # Nén Gzip tăng tốc tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Phục vụ Frontend React (Build tĩnh trong dist/)
    location / {
        root /var/www/web-rin/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Cực kỳ quan trọng: Tránh lỗi 404 khi người dùng F5 trang
    }

    # 2. Caching cho các file tĩnh đã build (JS, CSS, Ảnh)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        root /var/www/web-rin/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Reverse Proxy chuyển hướng toàn bộ API về Node.js Express (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout cho các tác vụ tải video nặng
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 4. Phục vụ Video Streaming từ uploads/
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
